<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="t d"><title id="t">1959—1971：美国音乐与社会史</title><desc id="d">从1959年空难到1971年American Pie发行的7个重要时间节点。历史事件不等同于歌词的逐句谜底。</desc><defs><linearGradient id="p" x2="0" y2="1"><stop stop-color="#f4ecdc"/><stop offset="1" stop-color="#e6d9c3"/></linearGradient><pattern id="g" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" opacity=".28"/></pattern></defs><rect width="1600" height="680" rx="16" fill="url(#p)"/><rect width="1600" height="680" rx="16" fill="url(#g)"/><path d="M65 120H1530M65 572H1530" stroke="#a74339" stroke-width="2" opacity=".45"/><text x="75" y="86" fill="#8f2e2c" font-family="Georgia,serif" font-size="55" font-weight="700">1959 — 1971</text><text x="645" y="75" fill="#354651" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">FROM PRIVATE LOSS TO CULTURAL MEMORY</text><path d="M92 342H1512" stroke="#233542" stroke-width="8" stroke-linecap="round"/><path d="M92 342H1512" stroke="#d5ab7d" stroke-width="2" stroke-dasharray="12 17"/><g font-family="Arial,'Noto Sans SC',sans-serif" fill="#253743"><circle cx="140" cy="342" r="17" fill="#a53d30" stroke="#f6eedf" stroke-width="6"/><text x="100" y="303" font-size="34" font-weight="700">1959</text><text x="100" y="401" font-size="22">Buddy Holly 等人</text><text x="100" y="430" font-size="22">遇难</text><circle cx="340" cy="342" r="17" fill="#253743" stroke="#f6eedf" stroke-width="6"/><text x="303" y="303" font-size="34" font-weight="700">1961</text><text x="302" y="401" font-size="21">McLean 父亲去世</text><circle cx="555" cy="342" r="17" fill="#a53d30" stroke="#f6eedf" stroke-width="6"/><text x="512" y="303" font-size="34" font-weight="700">1963</text><text x="504" y="401" font-size="21">华盛顿大游行</text><text x="504" y="430" font-size="21">肯尼迪遇刺</text><circle cx="790" cy="342" r="17" fill="#253743" stroke="#f6eedf" stroke-width="6"/><text x="747" y="303" font-size="34" font-weight="700">1964</text><text x="735" y="401" font-size="21">《民权法案》</text><circle cx="1005" cy="342" r="17" fill="#a53d30" stroke="#f6eedf" stroke-width="6"/><text x="963" y="303" font-size="34" font-weight="700">1968</text><text x="944" y="401" font-size="21">两起政治暗杀</text><circle cx="1210" cy="342" r="17" fill="#253743" stroke="#f6eedf" stroke-width="6"/><text x="1169" y="303" font-size="34" font-weight="700">1969</text><text x="1138" y="401" font-size="21">Woodstock</text><text x="1138" y="430" font-size="21">与 Altamont</text><circle cx="1445" cy="342" r="17" fill="#a53d30" stroke="#f6eedf" stroke-width="6"/><text x="1404" y="303" font-size="34" font-weight="700">1971</text><text x="1366" y="401" font-size="21">American Pie</text><text x="1366" y="430" font-size="21">发行</text></g><text x="76" y="625" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" fill="#5c5e58">提示：这是历史背景的并置，并非对歌词人物与事件的一一对应判定。</text><text x="1520" y="625" text-anchor="end" font-family="Georgia,serif" font-size="19" fill="#8f2e2c">ECHOES OF AN ERA · ORIGINAL INFOGRAPHIC</text></svg>